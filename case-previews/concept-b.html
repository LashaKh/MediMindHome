<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case B — The 2 a.m. Timeline (minimal)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1a365d; --secondary:#2b6cb0; --accent:#3182ce; --light-acc:#bee3f8;
    --tint:#f0f7ff; --body:#334155; --muted:#64748b; --light:#94a3b8;
    --hair:#e2e8f0; --white:#fff; --subtle:#f8fafc;
    --warm:#d83a3a; --warm-deep:#b22424; --warm-bg:rgba(216,58,58,.10); --warm-ring:rgba(216,58,58,.28);
    --grad:linear-gradient(135deg,#1a365d,#2b6cb0 50%,#3182ce);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#e9edf2;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .slide{position:relative;width:1280px;height:720px;flex:none;background:var(--white);border-radius:16px;box-shadow:0 24px 70px -24px rgba(26,54,93,.28),0 2px 8px rgba(26,54,93,.05);overflow:hidden;color:var(--body);}
  .slide::before{content:'';position:absolute;top:-180px;right:-160px;width:560px;height:560px;background:radial-gradient(circle at center,rgba(190,227,248,.30),rgba(190,227,248,0) 70%);pointer-events:none;}
  .canvas{position:relative;z-index:1;height:100%;padding:44px 70px 44px;display:flex;flex-direction:column;}
  .fade{opacity:0;transform:translateY(10px);animation:rise .8s cubic-bezier(.22,.61,.36,1) forwards;}
  .d1{animation-delay:.05s;}.d2{animation-delay:.14s;}.d3{animation-delay:.28s;}.d4{animation-delay:.44s;}.d5{animation-delay:.62s;}
  @keyframes rise{to{opacity:1;transform:none;}}

  .masthead{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--hair);}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);}
  .brandmark{display:flex;align-items:center;gap:9px;}
  .brandmark span{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);}

  /* title = the thesis */
  .lede{padding:22px 0 4px;}
  .headline{font-size:46px;font-weight:800;line-height:1.06;letter-spacing:-.025em;color:var(--navy);}
  .headline .accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .credtag{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .credtag .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(49,130,206,.14);}

  /* ── Stage: origin | two lanes ── */
  .stage{flex:1;min-height:0;display:grid;grid-template-columns:210px 1fr;gap:38px;align-items:center;}

  .origin{position:relative;height:64%;display:flex;flex-direction:column;justify-content:center;padding-right:34px;}
  .origin::after{content:'';position:absolute;right:0;top:8%;bottom:8%;width:2px;border-radius:2px;background:linear-gradient(to bottom,rgba(49,130,206,.55),rgba(216,58,58,.55));}
  .oclock{font-size:68px;font-weight:900;letter-spacing:-.045em;color:var(--navy);line-height:.9;font-variant-numeric:tabular-nums;}
  .oclock .am{font-size:22px;font-weight:800;color:var(--light);margin-left:8px;letter-spacing:-.02em;}
  .osub{margin-top:14px;font-size:17px;font-weight:800;color:var(--secondary);letter-spacing:-.01em;}

  .lanes{display:flex;flex-direction:column;gap:42px;}
  .lane-tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:20px;}
  .lane-tag .sq{width:9px;height:9px;border-radius:2px;}
  .lane.human .lane-tag{color:var(--warm-deep);} .lane.human .sq{background:var(--warm);}
  .lane.mm .lane-tag{color:var(--secondary);} .lane.mm .sq{background:var(--accent);}

  .nodes{position:relative;display:flex;align-items:flex-start;}
  .nodes::before{content:'';position:absolute;left:17px;right:17px;top:16px;height:2px;border-radius:2px;}
  .lane.human .nodes::before{background:linear-gradient(90deg,var(--accent) 0%,#9bb6d4 38%,var(--warm) 76%,var(--warm) 100%);}
  .lane.mm .nodes::before{left:17px;right:auto;width:calc(64% - 17px);background:linear-gradient(90deg,var(--accent),#7fb0e0);}

  .tnode{position:relative;z-index:1;flex:1;padding-right:16px;}
  .tnode .ic{width:34px;height:34px;border-radius:50%;background:var(--white);border:2.5px solid var(--accent);display:grid;place-items:center;box-shadow:0 0 0 5px rgba(49,130,206,.08);}
  .tnode .ic svg{width:18px;height:18px;display:block;}
  .tnode.grey .ic{border-color:#9bb6d4;box-shadow:0 0 0 5px rgba(155,182,212,.16);}
  .tnode.grey .ic::after{content:'';width:9px;height:9px;border-radius:50%;background:#9bb6d4;}
  .tnode.warm .ic{border-color:var(--warm);box-shadow:0 0 0 5px var(--warm-bg);}
  .tnode.warm .ic::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--warm);}
  .tnode.end .ic{width:38px;height:38px;}
  .tnode.end.warm .ic::after{width:12px;height:12px;}
  .tnode .ttl{margin-top:15px;font-size:18.5px;font-weight:800;letter-spacing:-.018em;color:var(--navy);line-height:1.12;}
  .tnode.warm .ttl{color:var(--warm-deep);}
  .tnode.good .ttl{color:var(--secondary);}

  /* the misdirection marker under node 1 */
  .misdir{margin-top:11px;position:relative;padding-top:11px;max-width:160px;}
  .misdir::before{content:'';position:absolute;left:0;top:0;width:62%;height:8px;border:1.5px solid #cfd9e6;border-bottom:none;border-radius:5px 5px 0 0;}
  .misdir b{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--light);}

  .lane.mm .nodes{align-items:center;}
  .arrow{flex:none;align-self:center;margin-top:1px;color:var(--accent);font-size:24px;font-weight:800;padding:0 10px;}
  .tnode.good .ic{border-color:var(--accent);background:var(--tint);}
</style>
</head>
<body>
  <div class="slide" role="img" aria-label="Case study — at 02:00 people miss things, MediMind doesn't">
    <div class="canvas">

      <div class="masthead fade d1">
        <div class="eyebrow">04 · Case Study</div>
        <div class="brandmark">
          <svg viewBox="0 0 100 100" width="24" height="24" aria-hidden="true">
            <rect x="6" y="14" width="88" height="14" rx="3" fill="#2b6cb0"/>
            <rect x="6" y="34" width="88" height="14" rx="3" fill="#2b6cb0" opacity=".75"/>
            <rect x="6" y="54" width="88" height="14" rx="3" fill="#2b6cb0" opacity=".5"/>
            <rect x="6" y="74" width="88" height="14" rx="3" fill="#2b6cb0" opacity=".3"/>
          </svg>
          <span>MediMind OS</span>
        </div>
      </div>

      <div class="lede fade d2">
        <h1 class="headline">At 02:00, people miss things.<br><span class="accent">MediMind doesn't.</span></h1>
        <div class="credtag"><span class="dot"></span>Real case · MediMind pilot hospital</div>
      </div>

      <div class="stage">
        <!-- origin -->
        <div class="origin fade d3">
          <div class="oclock">02:00<span class="am">am</span></div>
          <div class="osub">Stomach pain · ER</div>
        </div>

        <!-- lanes -->
        <div class="lanes">
          <!-- human path -->
          <div class="lane human fade d4">
            <div class="lane-tag"><span class="sq"></span>Without</div>
            <div class="nodes">
              <div class="tnode">
                <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#3182ce"/></svg></div>
                <div class="ttl">Eyes on the heart</div>
                <div class="misdir"><b>The misdirection</b></div>
              </div>
              <div class="tnode grey"><div class="ic"></div><div class="ttl">Hours lost</div></div>
              <div class="tnode warm"><div class="ic"></div><div class="ttl">Pancreatitis found</div></div>
              <div class="tnode warm end"><div class="ic"></div><div class="ttl">20 days in ICU</div></div>
            </div>
          </div>

          <!-- MediMind path -->
          <div class="lane mm fade d5">
            <div class="lane-tag"><span class="sq"></span>With MediMind</div>
            <div class="nodes">
              <div class="tnode good">
                <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#3182ce" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
                <div class="ttl">Flagged at 02:00</div>
              </div>
              <div class="arrow">→</div>
              <div class="tnode good end" style="flex:1.5;">
                <div class="ic" style="border-style:dashed;"><svg viewBox="0 0 24 24" fill="none" stroke="#3182ce" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M22 4 12 14l-3-3"/></svg></div>
                <div class="ttl">Caught hours earlier</div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
