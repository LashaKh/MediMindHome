<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><title>WhatWeAre C — signal path</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --emr-primary:#1a365d; --emr-secondary:#2b6cb0; --emr-accent:#3182ce; --emr-light-accent:#bee3f8;
    --emr-bg-page:#fff; --emr-bg-subtle:#f8fafc; --emr-bg-tint:#f0f7ff;
    --emr-text-primary:#1a365d; --emr-text-body:#334155; --emr-text-muted:#64748b; --emr-text-light:#94a3b8; --emr-border:#e2e8f0;
    --emr-gradient-primary:linear-gradient(135deg,#1a365d 0%,#2b6cb0 50%,#3182ce 100%);
    --csb-red:#d83a3a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#e9edf2;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .slide{position:relative;width:1280px;height:720px;flex:none;background:#fff;border-radius:16px;box-shadow:0 24px 70px -24px rgba(26,54,93,.28);overflow:hidden;font-size:22px;color:var(--emr-text-body);}
  .slide-inner{height:100%;padding:60px 90px 54px;display:flex;flex-direction:column;}
  .headline-big{font-size:2.2em;font-weight:800;line-height:1.08;letter-spacing:-.03em;color:var(--emr-text-primary);margin:0;}
  .headline-big em{font-style:normal;background:var(--emr-gradient-primary);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .headline-sub{font-size:.86em;line-height:1.4;color:var(--emr-text-muted);margin:12px 0 0;max-width:980px;}
  .headline-sub strong{color:var(--emr-text-body);font-weight:700;} .headline-sub em{font-style:normal;color:var(--emr-secondary);font-weight:600;}

  .fp-wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:14px;}
  .floor-plan{position:relative;width:calc(100% + 140px);margin:0 -70px;padding:4px 4px 0;border-radius:14px;
    background:radial-gradient(ellipse 55% 70% at 50% 50%,rgba(49,130,206,.10) 0%,rgba(49,130,206,.04) 45%,transparent 78%);}
  .floor-plan svg{width:100%;height:auto;display:block;overflow:visible;}
  .fp-room-shadow{fill:rgba(15,32,58,.10);filter:blur(4px);}
  .fp-room-bg{fill:url(#fpRoomGrad);stroke:rgba(190,227,248,.85);stroke-width:1;}
  .fp-room-accent{fill:url(#fpRoomAccent);opacity:.92;}
  .fp-room-icon{stroke:var(--emr-secondary);fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;}
  .fp-room-icon-dot{fill:var(--emr-secondary);stroke:none;}
  .fp-room-name{font-weight:800;font-size:13px;fill:var(--emr-text-primary);letter-spacing:.06em;}
  .fp-room-std{font-weight:600;font-size:9.5px;fill:#475569;letter-spacing:.005em;}
  .fp-room-std-star{fill:var(--emr-accent);}
  .fp-brain-shadow{fill:rgba(15,32,58,.30);filter:blur(8px);}
  .fp-brain-bg{fill:url(#fpBrainGrad);stroke:rgba(190,227,248,.30);stroke-width:1;}
  .fp-brain-pattern{fill:url(#fpBrainPattern);opacity:.55;}
  .fp-brain-aura{fill:url(#fpBrainAura);animation:fpAura 3.4s ease-in-out infinite;}
  .fp-brain-core{fill:url(#fpBrainCore);transform-origin:center;transform-box:fill-box;animation:fpPulse 3.4s ease-in-out infinite;}
  .fp-brain-ring{fill:none;stroke:rgba(190,227,248,.55);stroke-width:1.2;}
  .fp-brain-ring.r1{stroke-dasharray:3 3;animation:fpRing 3.4s ease-out infinite;}
  .fp-brain-ring.r2{stroke-dasharray:2 4;opacity:.55;animation:fpRing 3.4s ease-out infinite 1.1s;}
  .fp-brain-ring.r3{stroke-dasharray:1 5;opacity:.30;animation:fpRing 3.4s ease-out infinite 2.2s;}
  .fp-brain-title{font-weight:800;font-size:22px;fill:#fff;letter-spacing:.22em;text-anchor:middle;}
  .fp-foundation-text{font-weight:800;font-size:11px;fill:#fff;letter-spacing:.22em;text-transform:uppercase;}
  @keyframes fpPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
  @keyframes fpRing{0%{r:38px;opacity:.65;}100%{r:92px;opacity:0;}}
  @keyframes fpAura{0%,100%{opacity:.55;}50%{opacity:.85;}}

  /* cascade overlay */
  .fpx-ray{stroke:var(--emr-accent);stroke-width:1.6;fill:none;opacity:.5;stroke-dasharray:4 5;animation:fpxFlow 1.3s linear infinite;}
  @keyframes fpxFlow{to{stroke-dashoffset:-18;}}
  .fpx-glow{fill:none;stroke:var(--emr-accent);stroke-width:7;opacity:.16;filter:blur(3px);}
  .fpx-wash{fill:rgba(49,130,206,.08);stroke:none;}
  .fpx-ring{fill:none;stroke:var(--emr-accent);stroke-width:2.4;}
  .fpx-badge circle{fill:var(--emr-accent);}
  .fpx-badge path{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .fpx-catch-pill{fill:#fff;stroke:var(--csb-red);stroke-width:1.3;}
  .fpx-catch-dot{fill:var(--csb-red);}
  .fpx-catch-tx{font-size:11px;font-weight:800;fill:var(--csb-red);letter-spacing:.01em;}
  .fpx-tag{font-size:11px;font-weight:700;fill:var(--emr-secondary);letter-spacing:.04em;text-transform:uppercase;}

  /* B */
  .fpx-ring-soft{fill:none;stroke:var(--emr-accent);stroke-width:1.6;opacity:.55;stroke-dasharray:3 3;}
  .fpx-numbadge circle{fill:var(--emr-accent);} .fpx-numbadge text{fill:#fff;font-size:10px;font-weight:800;}
  .fpx-legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px 16px;margin:0 -40px;padding:12px 20px;border-radius:13px;
    background:var(--emr-bg-subtle);border:1px solid var(--emr-border);}
  .fpx-legend-h{font-size:.52em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--emr-text-primary);}
  .fpx-legend-step{display:inline-flex;align-items:center;gap:7px;font-size:.6em;font-weight:700;color:var(--emr-text-body);}
  .fpx-legend-step i{width:17px;height:17px;border-radius:50%;background:var(--emr-accent);color:#fff;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center;}
  .fpx-legend-f{font-size:.6em;font-weight:800;color:var(--emr-secondary);}

  /* C */
  .fpx-inbound{fill:none;stroke:var(--csb-red);stroke-width:2.4;opacity:.7;stroke-dasharray:5 5;animation:fpxFlow 1.1s linear infinite;}
  .fpx-flow-in{fill:var(--csb-red);}
  .fpx-branch{stroke:var(--emr-accent);stroke-width:3.4;fill:none;opacity:.95;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(49,130,206,.6));}
  .fpx-flow-out{fill:#fff;}
  .fpx-end{fill:var(--emr-accent);filter:drop-shadow(0 0 6px rgba(49,130,206,.7));}
  .fpx-burst{fill:none;stroke:var(--csb-red);stroke-width:2.4;opacity:.7;animation:fpRing 1.8s ease-out infinite;}
</style></head>
<body><div class="slide"><div class="slide-inner">
<h2 class="headline-big">MediMind is&hellip; <em>all in one, <span style="white-space:nowrap">AI-native hospital-wide OS.</span></em></h2>
<p class="headline-sub"><strong>Picture the 2&nbsp;a.m. case</strong> — one signal, and the whole hospital moves. <em>Not one alert; the entire response.</em></p>
<div class="fp-wrap">
  <div class="floor-plan"><svg viewBox="0 0 1100 326" xmlns="http://www.w3.org/2000/svg" aria-label="Inside MediMind: 12 hospital modules built on the MediMind EMR core">
              <defs>
                <!-- Room body gradient -->
                <linearGradient id="fpRoomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff"/>
                  <stop offset="100%" stop-color="#eef6ff"/>

                  <stop offset="0%" stop-color="#1a365d"/>
                  <stop offset="50%" stop-color="#2b6cb0"/>
                  <stop offset="100%" stop-color="#3182ce"/>

                <!-- Brain panel deep gradient -->
                <linearGradient id="fpBrainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#0f2947"/>
                  <stop offset="50%" stop-color="#1a365d"/>
                  <stop offset="100%" stop-color="#2b6cb0"/>

                <!-- Brain core white-hot center -->

                  <stop offset="35%" stop-color="#ffffff" stop-opacity="0.95"/>
                  <stop offset="65%" stop-color="#bee3f8" stop-opacity="0.7"/>
                  <stop offset="100%" stop-color="#3182ce" stop-opacity="0"/>
                </radialGradient>
                <!-- Pulse line gradient -->
                <linearGradient id="fpPulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="rgba(190, 227, 248, 0.85)"/>
                  <stop offset="100%" stop-color="rgba(49, 130, 206, 0.20)"/>
                </linearGradient>
                <!-- Reusable star for "★" room standard markers -->
                <symbol id="fpStar" viewBox="0 0 10 10">

                </symbol>
              </defs>

              <!-- ─── FOUNDATION STRIP: MediMind EMR core beneath every module ─── -->

                <rect class="fp-foundation-shadow" x="2" y="298" width="1096" height="22" rx="6" fill="rgba(15, 32, 58, 0.18)"/>
                <rect class="fp-foundation-bar" x="0" y="294" width="1100" height="26" rx="6" fill="url(#fpBrainGrad)"/>
                <rect class="fp-foundation-pattern" x="0" y="294" width="1100" height="26" rx="6" fill="url(#fpBrainPattern)"/>
                <text class="fp-foundation-text" x="550" y="311" text-anchor="middle">★  EMR · CORE · FHIR R4  —  ONE PLATFORM, EVERY MODULE  ★</text>
              </g>

              <!-- ─── ROW 1: Clinical Floor (Y=12, h=68) ─── -->
              <g class="fp-rooms-row1">
                <!-- ER -->
                <g class="fp-room" transform="translate(24, 12)">
                  <rect class="fp-room-shadow" x="2" y="5" width="192" height="64" rx="7"/>
                  <rect class="fp-room-bg" x="0" y="0" width="192" height="68" rx="7"/>
                  <rect class="fp-room-accent" x="0" y="0" width="192" height="2.5" rx="1.2"/>
                  <g class="fp-room-icon" transform="translate(13, 12)">
                    <path d="M0 8 L3 8 L5 4 L7 12 L9 6 L11 9 L14 9"/>
                    <circle class="fp-room-icon-dot" cx="14" cy="9" r="1.4"/>
                  </g>
                  <text class="fp-room-name" x="36" y="22">ER</text>
                  <use href="#fpStar" x="13" y="38" width="7.5" height="7.5" class="fp-room-std-star"/>
                  <text class="fp-room-std" x="24" y="44">ESI triage + sepsis screening</text>
                  <text class="fp-room-std" x="13" y="58" style="fill:var(--emr-text-light);font-weight:500;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;">Triage · Resus · Disposition</text>
                </g>
                <!-- ICU -->
                <g class="fp-room" transform="translate(238, 12)">
                  <rect class="fp-room-shadow" x="2" y="5" width="192" height="64" rx="7"/>

                  <rect class="fp-room-accent" x="0" y="0" width="192" height="2.5" rx="1.2"/>
                  <g class="fp-room-icon" transform="translate(13, 12)">
                    <rect x="0" y="2" width="14" height="9" rx="1.2"/>
                    <path d="M2 7 L4 7 L5 4 L7 9 L9 5 L11 7 L13 7"/>
                  </g>
                  <text class="fp-room-name" x="36" y="22">ICU</text>
                  <use href="#fpStar" x="13" y="38" width="7.5" height="7.5" class="fp-room-std-star"/>
                  <text class="fp-room-std" x="24" y="44">Continuous monitoring + EWS</text>
                  <text class="fp-room-std" x="13" y="58" style="fill:var(--emr-text-light);font-weight:500;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;">Vitals · Sepsis · Bundles</text>
                </g>
                <!-- OR -->
                <g class="fp-room" transform="translate(452, 12)">
                  <rect class="fp-room-shadow" x="2" y="5" width="192" height="64" rx="7"/>

                  <rect class="fp-room-accent" x="0" y="0" width="192" height="2.5" rx="1.2"/>
                  <g class="fp-room-icon" transform="translate(13, 12)">
                    <path d="M0 11 L9 2"/>
                    <path d="M8 1 L11 4 L13 6 L11 8 L8 5 z"/>

                  <text class="fp-room-std" x="13" y="58" style="fill:var(--emr-text-light);font-weight:500;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;">Anesthesia · Theatre · Recovery</text>
                </g>
                <!-- WARDS -->
                <g class="fp-room" transform="translate(666, 12)">
                  <rect class="fp-room-shadow" x="2" y="5" width="192" height="64" rx="7"/>
                  <rect class="fp-room-bg" x="0" y="0" width="192" height="68" rx="7"/>
                  <rect class="fp-room-accent" x="0" y="0" width="192" height="2.5" rx="1.2"/>
                  <g class="fp-room-icon" transform="translate(13, 12)">
                    <path d="M0 11 L0 6 L4 6 L4 4 L14 4 L14 11"/>

                  <text class="fp-room-name" x="36" y="22">WARDS</text>
                  <use href="#fpStar" x="13" y="38" width="7.5" height="7.5" class="fp-room-std-star"/>
                  <text class="fp-room-std" x="24" y="44">I-PASS handoff + bed flow</text>
                  <text class="fp-room-std" x="13" y="58" style="fill:var(--emr-text-light);font-weight:500;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;">Inpatient · Discharge · Notes</text>
                </g>
                <!-- PACS -->
                <g class="fp-room" transform="translate(880, 12)">
                  <rect class="fp-room-shadow" x="2" y="5" width="192" height="64" rx="7"/>
                  <rect class="fp-room-bg" x="0" y="0" width="192" height="68" rx="7"/>
                  <rect class="fp-room-accent" x="0" y="0" width="192" height="2.5" rx="1.2"/>
                  <g class="fp-room-icon" transform="translate(13, 12)">
                    <rect x="0" y="0" width="14" height="12" rx="1"/>
                    <circle cx="7" cy="6" r="3"/>
                    <path d="M7 3 L7 6 L9 8"/>
                  </g>
                  <text class="fp-room-name" x="36" y="22">PACS</text>
                  <use href="#fpStar" x="13" y="38" width="7.5" height="7.5" class="fp-room-std-star"/>
                  <text class="fp-room-std" x="24" y="44">Cornerstone3D + radiology</text>
                  <text class="fp-room-std" x="13" y="58" style="fill:var(--emr-text-light);font-weight:500;font-size:8px;letter-spacing:0.08em;text-transform:uppercase;">DICOM · CT · MRI · X-Ray</text>

              <!-- ─── ROW 2: LAB · BRAIN · PHARMACY (Y=92, h=106) ─── -->

                    <rect x="298" y="54" width="4" height="4" rx="0.9" fill="#1a365d" opacity="0.69"/>

                    <rect x="316" y="54" width="4" height="4" rx="0.9" fill="#1a365d" opacity="0.69"/>
                    <rect x="298" y="60" width="4" height="4" rx="0.9" fill="#1a365d" opacity="0.535"/>
                    <rect x="304" y="60" width="4" height="4" rx="0.9" fill="#1a365d" opacity="0.535"/>

                  <!-- Headers -->
                  <text class="fp-brain-title" x="309" y="92">MEDIMIND</text>
                </g>

                <!-- PHARMACY (right edge) -->
                <g class="fp-room" transform="translate(880, 92)">
                  <rect class="fp-room-shadow" x="2" y="5" width="192" height="100" rx="7"/>
                  <rect class="fp-room-bg" x="0" y="0" width="192" height="106" rx="7"/>

                  <g class="fp-room-icon" transform="translate(13, 14)">
                    <rect x="2" y="0" width="10" height="14" rx="2"/>
                    <path d="M2 5 L12 5"/>
                    <path d="M5 8 L9 8 M 7 7 L 7 11"/>
                  </g>
                  <text class="fp-room-name" x="36" y="24">PHARMACY · MAR</text>
                  <use href="#fpStar" x="13" y="46" width="7.5" height="7.5" class="fp-room-std-star"/>
                  <text class="fp-room-std" x="24" y="52">Beers + native DDI</text>
