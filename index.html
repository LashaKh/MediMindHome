<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons + PWA -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The hero's surface: daylight by day, the ink canvas by night. -->
    <meta name="theme-color" content="#edf3fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030913" media="(prefers-color-scheme: dark)" />

    <!-- Inter (latin) is used above the fold; Georgian loads only when needed. -->
    <link rel="preload" href="/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <title>MediMind · The hospital that thinks ahead.</title>
    <meta name="description" content="MediMind is the AI-native hospital operating system, built ground-up on FHIR R4 and running a 25-hospital network. One operating system runs the whole hospital and prepares every next step. Your doctors decide." />
    <link rel="canonical" href="https://medimind.md/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://medimind.md/" />
    <meta property="og:site_name" content="MediMind" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="MediMind · The hospital that thinks ahead." />
    <meta property="og:description" content="The AI-native hospital operating system, running a 25-hospital network. One operating system runs the whole hospital and prepares every next step. Your doctors decide." />
    <meta property="og:image" content="https://medimind.md/og-medimind.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MediMind logo with the headline: The hospital that thinks ahead. The AI-native hospital operating system." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MediMind · The hospital that thinks ahead." />
    <meta name="twitter:description" content="The AI-native hospital operating system, running a 25-hospital network. One operating system runs the whole hospital and prepares every next step. Your doctors decide." />
    <meta name="twitter:image" content="https://medimind.md/og-medimind.png" />
    <meta name="twitter:image:alt" content="MediMind logo with the headline: The hospital that thinks ahead. The AI-native hospital operating system." />

    <!-- Structured data: who we are, the site, the product. No ratings, prices or addresses. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://medimind.md/#organization",
            "name": "MediMind",
            "url": "https://medimind.md/",
            "logo": "https://medimind.md/android-chrome-512.png",
            "email": "team@medimind.md",
            "description": "The AI-native hospital operating system, built ground-up on FHIR R4 as the storage primitive."
          },
          {
            "@type": "WebSite",
            "@id": "https://medimind.md/#website",
            "name": "MediMind",
            "url": "https://medimind.md/",
            "inLanguage": "en",
            "publisher": { "@id": "https://medimind.md/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "MediMind",
            "url": "https://medimind.md/",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Hospital operating system",
            "description": "The AI-native hospital operating system. One operating system runs the whole hospital and prepares every next step. Your doctors decide.",
            "publisher": { "@id": "https://medimind.md/#organization" }
          }
        ]
      }
    </script>

    <div id="root"></div>
