<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MediMind favicon">
  <defs>
    <linearGradient id="favGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#1a365d"/>
      <stop offset="50%" stop-color="#2b6cb0"/>
      <stop offset="100%" stop-color="#3182ce"/>
    </linearGradient>
  </defs>
  <!-- Simplified mark: gradient tile + ONE bold ring + bold 2×2 module grid (legible ≤16px) -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#favGrad)"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
  <rect x="37" y="37" width="11" height="11" rx="2.5" fill="#ffffff"/>
  <rect x="52" y="37" width="11" height="11" rx="2.5" fill="#ffffff"/>
  <rect x="37" y="52" width="11" height="11" rx="2.5" fill="#ffffff"/>
  <rect x="52" y="52" width="11" height="11" rx="2.5" fill="#ffffff"/>
</svg>
