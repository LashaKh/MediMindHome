<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>MediMind · Four motion directions</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap');
    :root { color-scheme: light; font-family: Inter, 'Noto Sans Georgian', sans-serif; color: #1a365d; background: #f0f4f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 3px solid #78add7; outline-offset: 3px; }
    .toolbar { padding: 16px 26px 13px; border-bottom: 1px solid #dae3eb; background: #ffffffed; }
    .toolbar-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .identity { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 650; white-space: nowrap; }
    .identity img { width: 23px; height: 23px; }
    .identity span { color: #718198; font-size: 11px; font-weight: 500; border-left: 1px solid #dce5ed; padding-left: 12px; margin-left: 5px; }
    .directions { display: flex; align-items: center; padding: 4px; gap: 3px; background: #edf2f7; border: 1px solid #e3eaf0; border-radius: 13px; }
    .directions button { padding: 9px 13px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: #5d7087; font-size: 12px; font-weight: 600; white-space: nowrap; transition: color 160ms ease, background-color 160ms ease; }
    .directions button[aria-pressed="true"] { background: #fff; border-color: #dfe7ef; color: #1a365d; box-shadow: 0 2px 5px #1a365d08; }
    .directions b { font-size: 10px; margin-right: 6px; color: #8c9caf; }
    .actions { display: flex; align-items: center; gap: 7px; }
    .actions button { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 8px 10px; border: 1px solid #dce5ed; border-radius: 9px; background: #fff; color: #476582; font-size: 11px; }
    .toolbar-bottom { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 12px; font-size: 11px; line-height: 1.6; color: #677c92; }
    #description { margin: 0; }
    #instruction { margin: 0; color: #2b6a9d; font-weight: 500; }
    main { position: relative; display: flex; padding: 16px 24px; min-height: 580px; height: calc(100dvh - 148px); }
    iframe { width: 100%; height: 100%; min-height: 520px; border: 1px solid #dce5ed; border-radius: 17px; background: #fff; box-shadow: 0 18px 50px #1a365d09; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 27px 12px; font-size: 10px; line-height: 1.7; color: #7b8da0; }
    footer a { color: #51789b; text-decoration: none; border-bottom: 1px solid #cbdbe9; }
    #status { display: flex; align-items: center; gap: 6px; }
    #status::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #94a5b8; }
    #status[data-ready="true"]::before { background: #3a9c76; }
    @media (max-width: 1150px) {
      .identity span { display: none; }
      .toolbar { padding-inline: 16px; }
      .directions button { padding-inline: 9px; font-size: 11px; }
    }
    @media (max-width: 800px) {
      .toolbar-top { flex-wrap: wrap; gap: 12px; }
      .identity { flex: 1; }
      .directions { order: 3; width: 100%; overflow-x: auto; }
      .directions button { flex: 1; padding: 11px 10px; }
      .toolbar-bottom { flex-direction: column; align-items: flex-start; gap: 3px; margin-top: 9px; }
      main { padding: 10px; height: calc(100dvh - 205px); min-height: 560px; }
      iframe { border-radius: 12px; }
      footer { padding: 0 15px 12px; }
    }
    @media (prefers-reduced-motion: reduce) { .directions button { transition-duration: 125ms; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-top">
      <div class="identity"><img src="/deck-assets/logo-icon-dark.svg" alt="">MediMind<span id="preview-label">Four motion directions</span></div>
      <nav class="directions" aria-label="Motion direction">
        <button type="button" data-mode="active" aria-pressed="true"><b>01</b><span>Active hospital</span></button>
        <button type="button" data-mode="journeys" aria-pressed="false"><b>02</b><span>Outcome journeys</span></button>
        <button type="button" data-mode="depth" aria-pressed="false"><b>03</b><span>Layered depth</span></button>
        <button type="button" data-mode="cinematic" aria-pressed="false"><b>04</b><span>Cinematic opening</span></button>
      </nav>
      <div class="actions">
        <button type="button" id="replay"><span aria-hidden="true">↻</span><span id="replay-label">Replay</span></button>
        <button type="button" id="language" aria-label="Switch slide language">EN</button>
      </div>
    </div>
    <div class="toolbar-bottom"><p id="description"></p><p id="instruction"></p></div>
  </header>
  <main><iframe id="preview" title="Hospital motion comparison"></iframe></main>
  <footer><span id="status" role="status">Loading preview…</span><a id="original" href="/hospitals.html?lang=ka#/hospital-ai-assistants" target="_blank" rel="noopener">Open current slide ↗</a></footer>
  <script type="module">
    const descriptions = {
      active: {
        en: ['Department markers, illuminated rooms and a service moving through the hospital.', 'Click a department marker or an outcome card.'],
        ka: ['განყოფილებების მონიშვნა, განათებული სივრცეები და ინფორმაციის მოძრაობა კლინიკაში.', 'დააჭირეთ განყოფილების ნიშნულს ან შედეგის ბარათს.']
      },
      journeys: {
        en: ['Follow a complete workflow from the first action to the hospital outcome.', 'Choose any card to change the journey.'],
        ka: ['ნახეთ პროცესი პირველი მოქმედებიდან კლინიკისთვის მნიშვნელოვან შედეგამდე.', 'პროცესის შესაცვლელად აირჩიეთ ბარათი.']
      },
      depth: {
        en: ['Your original hospital, with layered light, a ground plane and floating information.', 'Move the pointer around the hospital. Click a card to focus.'],
        ka: ['კლინიკის იგივე გამოსახულება, სივრცის სიღრმე, განათება და ინფორმაციის ფენები.', 'ამოძრავეთ კურსორი კლინიკის გარშემო. აირჩიეთ ბარათი.']
      },
      cinematic: {
        en: ['Hospital first, then connections, financial outcomes and patient care.', 'Press Replay to see the opening again.'],
        ka: ['ჯერ კლინიკა, შემდეგ კავშირები, ფინანსური შედეგები და პაციენტზე ზრუნვა.', 'საწყისი ანიმაციის სანახავად დააჭირეთ „გამეორებას“.']
      }
    };
    const labels = { en: ['Active hospital', 'Outcome journeys', 'Layered depth', 'Cinematic opening'], ka: ['მოქმედი კლინიკა', 'პროცესის გზა', 'სივრცის სიღრმე', 'სცენური გახსნა'] };
    const params = new URLSearchParams(location.search);
    let mode = Object.hasOwn(descriptions, params.get('mode')) ? params.get('mode') : 'journeys';
    let lang = params.get('lang') === 'en' ? 'en' : 'ka';
    let loaded = false;
    const frame = document.getElementById('preview');
    const buttons = [...document.querySelectorAll('[data-mode]')];
    const status = document.getElementById('status');
    function updateToolbar() {
      document.documentElement.lang = lang;
      buttons.forEach((button, i) => {
        button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
        button.querySelector('span').textContent = labels[lang][i];
      });
      document.getElementById('description').textContent = descriptions[mode][lang][0];
      document.getElementById('instruction').textContent = descriptions[mode][lang][1];
      document.getElementById('replay-label').textContent = lang === 'ka' ? 'გამეორება' : 'Replay';
      document.getElementById('language').textContent = lang === 'ka' ? 'EN' : 'KA';
      document.getElementById('preview-label').textContent = lang === 'ka' ? 'მოძრაობის ოთხი ვერსია' : 'Four motion directions';
      document.getElementById('original').textContent = lang === 'ka' ? 'მიმდინარე სლაიდი ↗' : 'Open current slide ↗';
      document.getElementById('original').href = `/hospitals.html?lang=${lang}#/hospital-ai-assistants`;
      frame.title = `MediMind · ${labels[lang][buttons.findIndex(b => b.dataset.mode === mode)]}`;
      history.replaceState(null, '', `?lang=${lang}&mode=${mode}`);
    }
    function loadFrame(keyboard = false) {
      loaded = false;
      status.dataset.ready = 'false';
      status.textContent = lang === 'ka' ? 'ვერსია იტვირთება…' : 'Loading preview…';
      frame.src = `/hospitals.html?lang=${lang}&motion-preview=${mode}&motion-input=${keyboard ? 'keyboard' : 'pointer'}#/hospital-ai-assistants`;
    }
    buttons.forEach(button => button.addEventListener('click', event => {
      mode = button.dataset.mode;
      updateToolbar();
      if (loaded) frame.contentWindow.postMessage({ type: 'hai-preview-mode', mode, animate: event.detail !== 0 }, location.origin);
      else loadFrame(event.detail === 0);
    }));
    document.getElementById('replay').addEventListener('click', event => {
      if (loaded) frame.contentWindow.postMessage({ type: 'hai-preview-replay', animate: event.detail !== 0 }, location.origin);
    });
    document.getElementById('language').addEventListener('click', event => {
      lang = lang === 'ka' ? 'en' : 'ka'; updateToolbar(); loadFrame(event.detail === 0);
    });
    window.addEventListener('message', event => {
      if (event.origin !== location.origin || event.source !== frame.contentWindow) return;
      if (event.data?.type === 'hai-preview-error') {
        status.dataset.ready = 'false';
        status.textContent = lang === 'ka' ? 'ჩატვირთვა ვერ დასრულდა. განაახლეთ გვერდი.' : 'Could not finish loading. Refresh this page.';
        return;
      }
      if (event.data?.type !== 'hai-preview-ready') return;
      loaded = true;
      status.dataset.ready = 'true';
      status.textContent = lang === 'ka' ? 'შედარება · ძირითად სლაიდზე მეორე ვერსიაა' : 'Design comparison · Version 2 is now the default';
      if (event.data.mode !== mode) frame.contentWindow.postMessage({ type: 'hai-preview-mode', mode, animate: false }, location.origin);
    });
    updateToolbar();
    loadFrame();
  </script>
</body>
</html>
